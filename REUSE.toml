version = 1

# Files that cannot carry an SPDX header (JSON) and REUSE.toml itself.
[[annotations]]
path = ["CMakePresets.json", "REUSE.toml", "decoration/beveled.json", "decoration/kcm/kcm_beveleddecoration.json", "style/beveled.json", "style/kcm/beveledstyleconfig.json", "lookandfeel/beveled.desktop/metadata.json", "lookandfeel/beveled-dark.desktop/metadata.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 LonerCatboy"
SPDX-License-Identifier = "CC0-1.0"

# Wallpapers (Wikimedia Commons photos, CC BY-SA 4.0, resized) and the global theme previews
# (screenshots of Beveled over the same photos).
# Light: "21-224-5054 NNP Synevyr RB 18.jpg" by Roman Brechko (Rbrechko),
#   https://commons.wikimedia.org/wiki/File:21-224-5054_NNP_Synevyr_RB_18.jpg
# Dark: "Skäralid in Söderåsen National Park 121020 01.jpg" by Mats Brynolf (Auquamitzi),
#   https://commons.wikimedia.org/wiki/File:Sk%C3%A4ralid_in_S%C3%B6der%C3%A5sen_National_Park_121020_01.jpg
[[annotations]]
path = "lookandfeel/beveled.desktop/contents/previews/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 LonerCatboy", "2017 Roman Brechko"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "lookandfeel/beveled-dark.desktop/contents/previews/**"
precedence = "override"
SPDX-FileCopyrightText = ["2026 LonerCatboy", "2012 Mats Brynolf"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# README screenshots and recordings (wallpaper replaced with a flat color).
[[annotations]]
path = "docs/images/**"
precedence = "override"
SPDX-FileCopyrightText = "2026 LonerCatboy"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "wallpapers/beveled-synevyr/**"
precedence = "override"
SPDX-FileCopyrightText = "2017 Roman Brechko"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = "wallpapers/beveled-skaralid/**"
precedence = "override"
SPDX-FileCopyrightText = "2012 Mats Brynolf"
SPDX-License-Identifier = "CC-BY-SA-4.0"
